plugins {
	id 'java-library'
	// Maven Central publishing with sources/javadoc jars and signing. Publishing is a manual step: see PUBLISHING.md.
	id 'com.vanniktech.maven.publish' version '0.37.0'
	id 'com.diffplug.spotless' version '8.9.0'
}

group = 'ru.onlinesim'
version = '2.1.0'
description = 'Java client for the OnlineSim API: SMS numbers, rent, account and free numbers.'

repositories {
	mavenCentral()
}

dependencies {
	// Gson types (JsonElement) appear in a few public signatures: api, not implementation.
	// Gson 2.15 is Java 8 bytecode (module-info for 9+), so it stays usable by Java 11 consumers.
	api 'com.google.code.gson:gson:2.15.0'

	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The build runs on JDK 17+; the library itself targets Java 11 (class files major 55).
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xlint:all', '-Werror']
}
tasks.named('compileJava') {
	options.release = 11
}
// JUnit 6 needs Java 17: only the tests are compiled for it.
tasks.named('compileTestJava') {
	options.release = 17
}

tasks.named('javadoc') {
	options.encoding = 'UTF-8'
	options.addStringOption('-release', '11')
	options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

spotless {
	java {
		// palantir-java-format runs on JDK 11+; google-java-format 1.3x needs JDK 21, which the JDK 17 job lacks.
		palantirJavaFormat('2.103.0')
	}
}

mavenPublishing {
	publishToMavenCentral()
	// Signs when a key is configured (see PUBLISHING.md); without one, publishToMavenLocal works unsigned.
	if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
		signAllPublications()
	}
	coordinates('ru.onlinesim', 'onlinesim-api', version.toString())

	pom {
		name = 'onlinesim-api'
		description = project.description
		inceptionYear = '2021'
		url = 'https://github.com/s00d/onlinesim-java-api'
		licenses {
			license {
				name = 'Apache-2.0'
				url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
				distribution = 'repo'
			}
		}
		developers {
			developer {
				id = 's00d'
				name = 's00d'
				url = 'https://github.com/s00d'
			}
		}
		scm {
			url = 'https://github.com/s00d/onlinesim-java-api'
			connection = 'scm:git:git://github.com/s00d/onlinesim-java-api.git'
			developerConnection = 'scm:git:ssh://git@github.com/s00d/onlinesim-java-api.git'
		}
	}
}
