name: release

# Push a tag vX.Y.Z (X.Y.Z = `version` in build.gradle, with a "## X.Y.Z" section in CHANGELOG.md):
# CI runs, the artifact is signed and published to Maven Central, then the GitHub release is created.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag against the version and the changelog
        run: |
          version="$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in build.gradle"
            exit 1
          fi
          awk -v v="${version}" '$0 == "## " v {f=1; next} f && /^## / {exit} f' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## ${version}' section"
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists, skipping"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --latest --notes-file "${RUNNER_TEMP}/notes.md"
